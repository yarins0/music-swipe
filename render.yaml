services:
  - type: web
    name: music-swipe-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # @supabase/realtime-js requires a global WebSocket, which Node gained
      # in 22. On 20 the server throws at import before it can listen.
      - key: NODE_VERSION
        value: "22"
      # sync:false = the value is set in the Render dashboard, never committed.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # No web client exists. A native app sends no Origin header, so CORS
      # never applies to it. This value matches nothing and blocks browsers.
      - key: ALLOWED_ORIGINS
        value: "none"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "100"
