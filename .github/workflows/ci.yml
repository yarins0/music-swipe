name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the "base" build profile in eas.json.
          node-version: 20
          cache: npm
      - run: npm ci
      # The root eslint config and the root jest run both cover backend/src,
      # so the backend dependencies must be present in this job too.
      - run: npm ci --prefix backend
      - run: npm run lint
      - run: npm run build
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # backend has no eslint config of its own. It uses the root one, which
      # requires @eslint/eslintrc from the root node_modules.
      - run: npm ci
        working-directory: ${{ github.workspace }}
      - run: npm run lint
      - run: npm run build
      - run: npm test
