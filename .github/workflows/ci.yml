name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches the "base" build profile in eas.json.
          node-version: 20
          cache: npm
      - run: npm ci
      # The root eslint config and the root jest run both cover backend/src,
      # so the backend dependencies must be present in this job too.
      - run: npm ci --prefix backend
      - run: npm run lint
      - run: npm run build
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches NODE_VERSION in render.yaml. @supabase/realtime-js needs
          # the global WebSocket that Node gained in 22.
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # backend has no eslint config of its own. It uses the root one, which
      # requires @eslint/eslintrc from the root node_modules.
      - run: npm ci
        working-directory: ${{ github.workspace }}
      - run: npm run lint
      - run: npm run build
      - run: npm test

      # Starts the built server the way Render does. An import-time crash —
      # a missing global, a failed env guard — fails here instead of the deploy.
      # The Supabase values are dummies: nothing connects before /health answers.
      - name: Smoke test the built server
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-smoke-test
          PORT: "3001"
        run: |
          npm start &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/health; then exit 0; fi
            sleep 1
          done
          echo "The server never answered /health."
          exit 1
