name: EAS Build

# Never runs on a pull request. It needs the EXPO_TOKEN secret and burns EAS
# build credits, so a person triggers it deliberately.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile from eas.json
        type: choice
        options: [preview, production]
        default: preview
      platform:
        description: Target platform
        type: choice
        options: [all, ios, android]
        default: all
      submit:
        description: >-
          Upload the finished build to Google Play. Needs profile=production,
          platform=android, and the GOOGLE_SERVICE_ACCOUNT_JSON secret.
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # eas-cli needs Node >= 22. This is the runner that installs the CLI;
          # the Node version that builds the app is eas.json "node".
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci

      # Written only when submitting. eas.json points serviceAccountKeyPath here.
      - name: Write the Google Play service account key
        if: ${{ inputs.submit }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > google-service-account.json

      # --no-wait returns as soon as the build is queued, so the job stays short.
      - name: Build
        if: ${{ !inputs.submit }}
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait

      # No --no-wait here: the CLI must still be running, with the key file on
      # disk, to submit the artifact once the build finishes.
      - name: Build and submit to Google Play
        if: ${{ inputs.submit }}
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --auto-submit
